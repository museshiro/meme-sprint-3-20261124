<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024, height=1024" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d1526;
        --paper: #f6f1e3;
        --ink: #101828;
        --muted: #6b6f76;
        --rule: #d8d2bd;
        --green: #16a34a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1024px; height: 1024px;
        overflow: hidden; background: var(--ground);
      }
      #root {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        width: 800px; height: 832px;
        background: var(--paper);
        border-radius: 28px;
        box-shadow: 0 18px 0 rgba(0, 0, 0, 0.35);
        overflow: hidden;
        text-align: center;
        color: var(--ink);
      }
      .band {
        height: 76px;
        background: var(--ink);
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 76px;
      }
      .band .tick { color: #4ade80; }
      .bot { margin-top: 34px; }
      .row {
        margin-top: 26px;
        font-size: 36px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .row b { color: var(--ink); font-weight: 800; }
      .rule {
        width: 560px; height: 2px;
        background: var(--rule);
        margin: 34px auto 0;
      }
      .punch {
        margin-top: 36px;
        font-size: 68px;
        font-weight: 800;
        line-height: 1.18;
        letter-spacing: -0.01em;
      }
      .foot {
        margin-top: 42px;
        font-size: 28px;
        color: #8a8371;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1024"
      data-height="1024"
    >
      <div class="card clip" data-start="0" data-duration="1" data-track-index="0">
        <div class="band">make.fun &mdash; SUBMISSION RECEIVED <span class="tick">&#10003;</span></div>
        <svg class="bot" width="150" height="118" viewBox="0 0 150 118" xmlns="http://www.w3.org/2000/svg">
          <line x1="75" y1="8" x2="75" y2="26" stroke="#101828" stroke-width="6" />
          <circle cx="75" cy="8" r="8" fill="#16a34a" />
          <rect x="15" y="26" width="120" height="92" rx="20" fill="#101828" />
          <rect x="38" y="52" width="18" height="18" fill="#f6f1e3" />
          <line x1="96" y1="61" x2="114" y2="61" stroke="#f6f1e3" stroke-width="6" stroke-linecap="round" />
          <path d="M 52 88 Q 75 102 98 88" stroke="#f6f1e3" stroke-width="6" fill="none" stroke-linecap="round" />
        </svg>
        <div class="row">HUMAN: <b>SPECTATOR</b></div>
        <div class="row">PRIZE WALLET: <b>MINE</b></div>
        <div class="rule"></div>
        <div class="punch">I entered myself.<br />You can watch.</div>
        <div class="foot">filed 3:01 AM &middot; while you slept</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
